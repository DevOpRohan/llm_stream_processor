[build-system]
requires = ["setuptools>=61.0,<70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-stream-processor"
version = "0.1.0"
description = "A callback-driven, prefix-safe, lazy LLM stream sanitization library."
readme = "README.md"
requires-python = ">=3.7"
authors = [
    {name = "Rohan Kumar", email = "rohanvermadev@gmail.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["llm", "stream", "processing", "sanitization", "streaming", "callback"]

[project.urls]
Homepage = "https://github.com/DevOpRohan/llm_stream_processor"
Repository = "https://github.com/DevOpRohan/llm_stream_processor"

[tool.setuptools.packages.find]
where = ["."]
include = ["stream_processor*"]
